[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workflow"
version = "0.0.0"
description = "기존 에이전트 등록과 업무 자동 실행 — 중앙 서비스·연결 프로그램·진단 데모"
requires-python = ">=3.13"
# 하한은 2026-09-20 로컬에 설치된 버전. 정확한 고정은 첫 구현 step 에서 (ADR-0002).
dependencies = [
  "fastapi>=0.116",
  "uvicorn>=0.35",
  "pydantic>=2.11",
  "httpx>=0.28",
  "jinja2>=3.1",
  "python-multipart>=0.0.20",
  "openai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.16"]

[tool.hatch.build.targets.wheel]
packages = ["src/workflow", "src/diagnostic_demo"]

[tool.pytest.ini_options]
testpaths = ["scripts", "tests"]
pythonpath = ["src"]
# e2e 는 WORKFLOW_E2E=1 일 때만 돈다 (tests/e2e). verify.sh 의 매 턴 pytest 에서는 건너뛴다
markers = ["e2e: 로컬 5-프로세스 전체 시나리오 (수 분)"]

[tool.ruff]
target-version = "py313"
line-length = 100
# docs/archive 의 프로브 스크립트는 보관 이력이라 검사하지 않는다
extend-exclude = ["docs"]

[tool.ruff.lint]
# ruff 0.16 의 기본 집합은 스타일 규칙까지 넓다. 훅 게이트는 실제 오류(문법·미정의 이름·미사용 import)에 한정한다.
select = ["E4", "E7", "E9", "F"]
