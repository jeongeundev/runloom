# PR 이 열리거나 새 커밋이 올라올 때마다 Claude 가 리뷰 코멘트를 남긴다.
# 브랜치 보호의 필수 검사라 PR head 마다 리뷰가 한 번은 돈다 — 리뷰 뒤 커밋이 오면 다시 돈다.
# 수정은 하지 않는다. 고칠지는 사람이 정하고, 필요하면 PR 에 @claude 로 맡긴다(claude.yml).
name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD BRANCH: ${{ github.head_ref }}

            이 PR 을 리뷰하라. 한국어로 쓴다.

            1. 설계대로 됐나 (먼저 본다). HEAD BRANCH 가 `feat-<phase>` 이면 하네스 phase 의 결과다.
               `phases/<phase>/` 의 index.json·step*.md(있으면 README.md)가 이 PR 의 설계다.
               각 step 의 요구·AC·금지사항이 diff 의 코드로 추적되는지 확인하고,
               빠진 동작·어긴 금지사항·설계에 없는 추가 동작을 지적한다.
               phase 브랜치가 아니면 PR 본문과 연결된 이슈를 설계로 본다.
            2. 저장소 규칙 — AGENTS.md (특히 CRITICAL 규칙), docs/GLOSSARY.md 용어,
               docs/ARCHITECTURE.md 계약.
            판단 기준은 고정 체크리스트가 아니라 위 설계와 이 저장소의 기존 코드 관례에서 끌어낸다.

            - 구체적인 결함은 해당 줄에 인라인 코멘트로 남긴다.
            - 구현 변경에 테스트가 따라오지 않았거나, 테스트가 삭제·skip·약화됐으면 반드시 지적한다.
            - 스타일 취향은 지적하지 않는다.
            - PR 본문 `## Needs decision` 의 항목마다 코드를 보고 의견을 붙인다
              (`추천: <선택> — <이유>`). 리뷰가 새로 찾은 판단거리와 같은 칸에 모은다.

            마지막에 요약 코멘트 하나를 아래 형식 그대로 남긴다. 칸 이름은 영어, 내용은 한국어.
            빈 칸은 `None`. 항목은 `파일:줄` — 문제 — 제안 순으로 짧게.

            ```
            ## Verdict
            병합 가능 | 병합 전 수정 필요 — Fix N · Needs decision N · Follow-up N

            ## Fix
            <!-- 이 PR 에서 고쳐야 병합할 수 있는 결함 -->

            ## Needs decision
            <!-- 사람이 정해야 할 것. `- [ ]` 체크박스, 선택지와 추천 -->

            ## Follow-up
            <!-- 병합은 막지 않는 별도 이슈 후보 -->

            ## Checked
            <!-- 확인했고 결함이 없던 것 (설계 추적·CRITICAL 규칙·테스트) -->

            ## Not reviewed
            <!-- 읽지 않은 범위 -->
            ```
          claude_args: |
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
