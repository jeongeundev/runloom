{# 3열 셸 — UI_GUIDE "앱 셸". 왼쪽 목록 · 가운데 본문 · 오른쪽 산출물 뷰어. 대화 입력창은 없다.
   스크립트는 여기 인라인 하나뿐이다 (폴링·뷰어 열기·목록 서랍·업무 표 묶음 접기·상세 패널·복사·원문 토글·JSON 폼). 외부 자원 없음. #}
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Runloom{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="shell" id="shell">
  <div class="topbar">
    <button type="button" class="icon-btn" id="nav-toggle" aria-label="목록">
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
    </button>
    <span class="brand">Runloom</span>
  </div>
  {% include "_sidebar.html" %}
  <main class="main">
    <div class="main-inner{% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
    </div>
  </main>
  <aside class="viewer" id="viewer"{% if not viewer %} hidden{% endif %}>
    {% block viewer %}{% endblock %}
  </aside>
</div>
<script>
(function () {
  var shell = document.getElementById('shell');
  var viewer = document.getElementById('viewer');
  var navToggle = document.getElementById('nav-toggle');
  if (navToggle) {
    navToggle.addEventListener('click', function () { shell.classList.toggle('nav-open'); });
  }

  // --- 뷰어 열기: 산출물 칩을 누르면 그 페이지의 뷰어 패널을 가져와 오른쪽 열에 넣는다 (800px 미만은 페이지 이동) ---
  function openViewerFrom(href) {
    return fetch(href, { headers: { 'Accept': 'text/html' } }).then(function (r) {
      if (!r.ok) { throw new Error(String(r.status)); }
      return r.text();
    }).then(function (html) {
      var tpl = document.createElement('template');
      tpl.innerHTML = html;
      var panel = tpl.content.querySelector('#viewer-panel');
      if (!panel) { throw new Error('panel'); }
      var current = document.getElementById('viewer-panel');
      if (current) { current.replaceWith(panel); } else { viewer.appendChild(panel); }
      viewer.hidden = false;
      shell.classList.add('viewer-open');
      bindViewer();
    });
  }
  function narrow() { return window.matchMedia('(max-width: 799px)').matches; }
  document.addEventListener('click', function (ev) {
    var link = ev.target.closest('a[data-open-viewer]');
    if (!link || narrow()) { return; }
    ev.preventDefault();
    openViewerFrom(link.getAttribute('href')).catch(function () { window.location.href = link.getAttribute('href'); });
  });
  document.addEventListener('click', function (ev) {
    var opener = ev.target.closest('[data-viewer-open]');
    if (opener && !narrow()) {
      ev.preventDefault();  // 넓은 화면에서는 오른쪽 열을 열고, 800px 미만에서는 링크대로 산출물 페이지로 간다
      viewer.hidden = false;
      shell.classList.add('viewer-open');
    }
    if (ev.target.closest('[data-viewer-close]')) {
      shell.classList.remove('viewer-open');
    }
  });

  // --- 업무 표: 묶음 접기(접힌 묶음 키는 localStorage — 읽기·쓰기 실패해도 동작), 행 아무 곳이나 누르면 그 행의 링크 ---
  var FOLDED = 'runloom.folded-groups';
  function folded() {
    try { return JSON.parse(window.localStorage.getItem(FOLDED) || '[]'); } catch (e) { return []; }
  }
  function fold(key, closed) {
    var body = document.querySelector('[data-group-body="' + CSS.escape(key) + '"]');
    var btn = document.querySelector('[data-group-toggle="' + CSS.escape(key) + '"]');
    if (!body || !btn) { return; }
    body.classList.toggle('folded', closed);
    btn.setAttribute('aria-expanded', closed ? 'false' : 'true');
    btn.textContent = closed ? '▸' : '▾';
  }
  folded().forEach(function (key) { fold(key, true); });
  document.addEventListener('click', function (ev) {
    var btn = ev.target.closest('[data-group-toggle]');
    if (btn) {
      var key = btn.getAttribute('data-group-toggle');
      var keys = folded().filter(function (k) { return k !== key; });
      var closed = btn.getAttribute('aria-expanded') === 'true';
      if (closed) { keys.push(key); }
      fold(key, closed);
      try { window.localStorage.setItem(FOLDED, JSON.stringify(keys)); } catch (e) { /* 저장 못 해도 접기는 된다 */ }
      return;
    }
    var row = ev.target.closest('tr.work-row');
    if (row && !ev.target.closest('a, button')) {
      var link = row.querySelector('a.row-link');
      if (link) { link.click(); }  // 아래 패널 열기를 거친다
    }
  });

  // --- 상세 패널: 행·카드·연결 업무 링크(`open=<key>`)를 누르면 조각(`/work/<key>/panel`)을 불러와 끼우고 주소만 바꾼다.
  //     닫기 버튼·Esc·뒤로 가기로 닫는다. 조각을 못 불러오면 그냥 링크로 간다. 패널 안 폼은 일반 POST ---
  var slot = document.getElementById('work-panel-slot');
  function panelUrl(href) {
    var u = new URL(href, window.location.href);
    var key = u.searchParams.get('open');
    if (!key) { return null; }
    u.searchParams.delete('open');
    var qs = u.searchParams.toString();
    return '/work/' + encodeURIComponent(key) + '/panel' + (qs ? '?' + qs : '');
  }
  function loadPanel(href) {
    var url = panelUrl(href);
    if (!url) { slot.innerHTML = ''; return Promise.resolve(); }
    return fetch(url, { headers: { 'Accept': 'text/html' }, credentials: 'same-origin' }).then(function (r) {
      if (!r.ok) { throw new Error(String(r.status)); }
      return r.text();
    }).then(function (html) { slot.innerHTML = html; });
  }
  if (slot) {
    document.addEventListener('click', function (ev) {
      if (ev.button !== 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey) { return; }
      var close = ev.target.closest('[data-panel-close]');
      if (close) {
        ev.preventDefault();
        slot.innerHTML = '';
        history.pushState(null, '', close.getAttribute('href'));
        return;
      }
      var link = ev.target.closest('a.row-link, a.board-card, #work-panel a[data-work-key]');
      if (!link) { return; }
      ev.preventDefault();
      var href = link.getAttribute('href');
      loadPanel(href).then(function () { history.pushState(null, '', href); })
        .catch(function () { window.location.href = href; });
    });
    window.addEventListener('popstate', function () {
      loadPanel(window.location.href).catch(function () { window.location.reload(); });
    });
    document.addEventListener('keydown', function (ev) {
      var close = slot.querySelector('[data-panel-close]');
      if (ev.key === 'Escape' && close) { close.click(); }
    });
  }

  // --- 뷰어 도구: 원문 보기 토글, 복사 ---
  function bindViewer() {
    var raw = document.querySelector('[data-raw-toggle]');
    var rawPre = document.querySelector('[data-raw]');
    if (raw && rawPre) {
      raw.addEventListener('click', function () {
        rawPre.hidden = !rawPre.hidden;
        raw.textContent = rawPre.hidden ? '원문 보기' : '원문 닫기';
      });
    }
    var copy = document.querySelector('[data-copy]');
    if (copy && rawPre && navigator.clipboard) {
      copy.addEventListener('click', function () {
        navigator.clipboard.writeText(rawPre.textContent).then(function () {
          copy.textContent = '복사됨';
          setTimeout(function () { copy.textContent = '복사'; }, 1500);
        });
      });
    }
  }
  bindViewer();

  // --- 복사: `data-copy-target` 버튼은 그 id 요소의 글자를 복사한다(한 번만 보이는 링크) ---
  document.querySelectorAll('[data-copy-target]').forEach(function (btn) {
    var target = document.getElementById(btn.getAttribute('data-copy-target'));
    if (!target || !navigator.clipboard) return;
    btn.addEventListener('click', function () {
      navigator.clipboard.writeText(target.textContent).then(function () {
        btn.textContent = '복사됨';
        setTimeout(function () { btn.textContent = '복사'; }, 1500);
      });
    });
  });

  // --- JSON 폼: `data-json-action` 폼은 운영자 JSON API 로 보낸다(GitHub 설정·담당 연결·사람 응답). 누른 버튼의
  //     data-json-action/-method/-omit 이 폼 값보다 앞선다. 필드 형식은 data-json-type(int·bool·list·int-list·optional).
  //     성공이면 새로 연다(미리보기는 problems 만 보인다). 보내는 동안 버튼을 막고, 응답 ID 는 서버가 폼에 심은 값이다 ---
  document.addEventListener('submit', function (ev) {
    var form = ev.target.closest('form[data-json-action]');
    if (!form) { return; }
    ev.preventDefault();
    var by = ev.submitter;
    function pick(name, fallback) {
      return (by && by.getAttribute(name)) || form.getAttribute(name) || fallback;
    }
    var action = pick('data-json-action', '');
    var omit = pick('data-json-omit', '').split(' ');
    var body = {};
    form.querySelectorAll('input[name], select[name], textarea[name]').forEach(function (el) {
      if (el.disabled || omit.indexOf(el.name) >= 0) { return; }
      var type = el.getAttribute('data-json-type') || 'str';
      var value = el.value;
      if (type === 'bool') { body[el.name] = el.checked; return; }
      if (type === 'int') { if (value.trim() !== '') { body[el.name] = Number(value); } return; }
      if (type === 'list' || type === 'int-list') {
        var items = value.split(/[\s,]+/).filter(Boolean);
        body[el.name] = type === 'int-list' ? items.map(Number) : items;
        return;
      }
      if (type === 'optional' && value.trim() === '') { return; }
      body[el.name] = value;
    });
    if (by && by.name) { body[by.name] = by.value; }
    if (body.action && body.action !== 'choose_agent') { delete body.agent_id; }
    var pathField = form.getAttribute('data-json-path-field');
    if (pathField) { action += '/' + encodeURIComponent(body[pathField]); delete body[pathField]; }
    var out = form.querySelector('[data-json-result]');
    function say(text) { if (out) { out.textContent = text; } }
    var buttons = form.querySelectorAll('button');
    buttons.forEach(function (b) { b.disabled = true; });
    fetch(action, {
      method: pick('data-json-method', 'POST'),
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) { return { ok: r.ok, data: data }; });
    }).then(function (res) {
      buttons.forEach(function (b) { b.disabled = false; });
      if (res.ok && res.data.problems) {
        say(res.data.problems.length ? res.data.problems.map(function (p) { return p.message; }).join(' / ') : '문제 없음');
      } else if (res.ok) {
        window.location.reload();
      } else {
        say(res.data.message || '요청이 거부되었습니다');
      }
    }).catch(function () {
      buttons.forEach(function (b) { b.disabled = false; });
      say('연결 실패 — 다시 보내도 같은 응답 ID 라 한 번만 반영됩니다');
    });
  });

  // --- 라이브 조각: 3초(완료·실패면 10초)마다 교체. 입력 중이면 건너뛴다. 결과 산출물이 바뀌면 뷰어를 위해 다시 연다.
  //     조각이 data-poll="0" 이면(워크플로우: 실행 중·실행 요청됨·대기 노드 없음) 다음 갱신을 잡지 않는다 ---
  var live = document.querySelector('[data-live]');
  if (!live) { return; }
  var url = live.getAttribute('data-live');
  function stamp(text) {
    var el = document.getElementById('live-stamp');
    if (el) { el.textContent = text; }
  }
  function delay() { return live.getAttribute('data-terminal') === '1' ? 10000 : 3000; }
  function typing() {
    var a = document.activeElement;
    return !!(a && (a.tagName === 'TEXTAREA' || a.tagName === 'SELECT') && live.contains(a));
  }
  function clock() {
    var d = new Date();
    return [d.getHours(), d.getMinutes(), d.getSeconds()].map(function (n) { return (n < 10 ? '0' : '') + n; }).join(':');
  }
  function tick() {
    if (typing()) { schedule(); return; }
    fetch(url, { cache: 'no-store', headers: { 'Accept': 'text/html' } }).then(function (r) {
      if (!r.ok) { throw new Error(String(r.status)); }
      return r.text();
    }).then(function (html) {
      var tpl = document.createElement('template');
      tpl.innerHTML = html.trim();
      var next = tpl.content.querySelector('[data-live]');
      if (!next) { throw new Error('fragment'); }
      if (next.getAttribute('data-result') !== live.getAttribute('data-result')) {
        window.location.reload();
        return;
      }
      // 펼쳐 둔 접이식 행은 교체 뒤에도 유지한다
      live.querySelectorAll('details[data-key]').forEach(function (d) {
        var twin = next.querySelector('details[data-key="' + d.getAttribute('data-key') + '"]');
        if (twin) { twin.open = d.open; }
      });
      live.replaceWith(next);
      live = next;
      live.classList.add('live-swap');
      stamp('마지막 갱신 ' + clock());
      schedule();
    }).catch(function () {
      stamp('갱신 실패, 재시도 중');
      schedule();
    });
  }
  function schedule() {
    if (live.getAttribute('data-poll') === '0') { return; }
    setTimeout(tick, delay());
  }
  stamp('마지막 갱신 ' + clock());
  schedule();
})();
</script>
</body>
</html>
